# Application
spring.application.name=hms
server.servlet.context-path=/piyumvilla
server.port=${PORT:8081}

# MySQL connection
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:piyumvilla}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:123456789}

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JSON handling
spring.jackson.deserialization.fail-on-unknown-properties=true

# Error responses
server.error.include-message=never
server.error.include-stacktrace=never

# Authentication mode: local-jwt or oauth2
app.security.auth-mode=${AUTH_MODE:local-jwt}

# Local JWT authentication
# JWT_SECRET must be configured as an environment variable.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=hms
app.security.jwt.audience=hms-api
app.security.jwt.ttl-seconds=10800

# Allowed React frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# External OAuth2 configuration
# Used only when AUTH_MODE=oauth2.
app.security.oauth2.issuer=${OAUTH2_ISSUER:}
app.security.oauth2.audience=${OAUTH2_AUDIENCE:}
app.security.oauth2.subject-bindings=${OAUTH2_SUBJECT_BINDINGS:}

# First administrator bootstrap: disabled normally
app.bootstrap.enabled=false

# Logging
logging.level.org.springframework.security=INFO

# Hotel used by the website
app.web.hotel-id=1

# Folder for uploaded hotel and room photographs
app.web.media-directory=H:/HMS/piyum-media

# Image upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.web.meals.bb.adult=2500
app.web.meals.bb.child=1250
app.web.meals.half-board.adult=5500
app.web.meals.half-board.child=2750
app.web.meals.full-board.adult=8000
app.web.meals.full-board.child=4000

app.web.identity-key=${IDENTITY_KEY}
